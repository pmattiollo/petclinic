<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilot — credit usage</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --track:          #cde2fb;
    --good:           #0ca30c;
    --warning:        #fab219;
    --critical:       #d03b3b;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --track:          #104281;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #898781;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --track:          #104281;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #898781;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 64px;
    background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .spacer { flex: 1; }
  button.ghost {
    font: inherit; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button.ghost:hover { color: var(--text-primary); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px 22px; margin-top: 20px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .card .note { color: var(--text-secondary); font-size: 12.5px; margin: 2px 0 0; }
  .cardhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }

  /* hero + stat tiles */
  .hero-row { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-end; }
  .hero .label { color: var(--text-secondary); font-size: 13px; }
  .hero .value { font-size: 52px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  .hero .unit { font-size: 20px; font-weight: 500; color: var(--text-secondary); margin-left: 6px; }
  .tiles { display: flex; gap: 32px; flex-wrap: wrap; }
  .tile .label { color: var(--text-secondary); font-size: 12.5px; }
  .tile .value { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .foot { color: var(--text-muted); font-size: 12px; }

  /* meter */
  .meter-track { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 5px; }
  .meter-legend { display: flex; justify-content: space-between; font-size: 12.5px;
                  color: var(--text-secondary); margin-top: 7px; }

  svg { display: block; width: 100%; height: auto; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axisline { stroke: var(--axis); stroke-width: 1; }
  text { fill: var(--text-muted); font-family: system-ui, -apple-system, sans-serif; }
  .tick { font-size: 11px; font-variant-numeric: tabular-nums; }
  .rowlabel { font-size: 12.5px; fill: var(--text-secondary); }
  .tipvalue { font-size: 12.5px; fill: var(--text-primary); font-weight: 600;
              font-variant-numeric: tabular-nums; }
  .peaklabel { font-size: 11.5px; fill: var(--text-secondary); font-weight: 600; }
  .band:hover .seg, .band:focus .seg { opacity: 0.72; }
  .band { outline: none; }
  .band:focus-visible .hit { stroke: var(--text-muted); stroke-width: 1; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px;
                 font-size: 12.5px; color: var(--text-secondary); }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  table { border-collapse: collapse; width: 100%; margin-top: 14px; font-size: 13px; }
  th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
  td { font-variant-numeric: tabular-nums; color: var(--text-primary); }
  th.name, td.name { text-align: left; font-variant-numeric: normal; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 7px; }
  [hidden] { display: none !important; }

  /* Sessions: a ranked list, not a chart. The bar is a reading aid glued to the
     number it encodes, so the eye gets the shape of the distribution without a
     second axis to parse. */
  .srow { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px;
          padding: 11px 0; border-bottom: 1px solid var(--border); }
  .srow:last-child { border-bottom: 0; }
  .stitle { color: var(--text-primary); font-size: 13.5px; font-weight: 600; }
  .smeta { color: var(--text-muted); font-size: 12px; font-weight: 400;
           margin-left: 8px; font-variant-numeric: tabular-nums; }
  .ssum { color: var(--text-secondary); font-size: 12.5px; line-height: 1.5;
          margin-top: 2px; max-width: 78ch; }
  .scost { color: var(--text-primary); font-size: 13.5px; font-weight: 600;
           font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .scost .unit { color: var(--text-muted); font-weight: 400; font-size: 11.5px; margin-left: 3px; }
  .sbar { grid-column: 1 / -1; height: 4px; border-radius: 2px;
          background: var(--grid); overflow: hidden; margin-top: 6px; }
  .sbar i { display: block; height: 100%; border-radius: 2px; }
  .sfiles { color: var(--text-muted); font-size: 11.5px; margin-top: 3px; }

  /* Calendar heatmap: one hue, light -> dark, anchored to the day you're allowed
     to burn (monthly quota / days in month) rather than to the window's own max,
     so "dark red" always means the same thing month to month. It doubles as the
     filter for the list below -- the same pixels that show you the bad day let
     you open it. */
  .calwrap { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start;
             margin-bottom: 16px; }
  .calcap { color: var(--text-muted); font-size: 11.5px; margin: 0 0 6px; }
  .cal { display: grid; grid-template-columns: repeat(7, 30px); gap: 4px; }
  .cal .dow { font-size: 10.5px; color: var(--text-muted); text-align: center;
              padding-bottom: 2px; letter-spacing: .02em; }
  .cell { width: 30px; height: 30px; border-radius: 6px; background: var(--grid);
          border: 0; padding: 0; margin: 0; font: inherit; font-size: 10.5px;
          font-variant-numeric: tabular-nums; color: var(--text-muted);
          display: flex; align-items: flex-start; justify-content: flex-end;
          cursor: pointer; position: relative; }
  .cell > span { padding: 2px 4px; }
  .cell.blank { visibility: hidden; }
  .cell.out { opacity: .3; cursor: default; }
  .cell.hot { color: rgba(255,255,255,.92); }
  .cell.sel { box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 4px var(--text-secondary); }
  .cell:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
  .calside { display: flex; flex-direction: column; gap: 10px; font-size: 12px;
             color: var(--text-secondary); max-width: 300px; }
  .calkey { display: flex; align-items: center; gap: 5px; color: var(--text-muted);
            font-size: 11.5px; }
  .calkey i { width: 13px; height: 13px; border-radius: 3px; display: inline-block; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  button.chip {
    font: inherit; font-size: 12px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 11px; cursor: pointer;
  }
  button.chip:hover { color: var(--text-primary); }
  button.chip[aria-pressed="true"] { color: var(--text-primary); border-color: var(--text-muted);
                                     background: var(--page); font-weight: 600; }
  .calhint { color: var(--text-muted); font-size: 11.5px; line-height: 1.5; }

  .tooltip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0;
    transition: opacity .08s; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    box-shadow: 0 4px 16px rgba(0,0,0,.16); font-size: 12.5px; min-width: 150px;
  }
  .tooltip .tt-head { color: var(--text-secondary); margin-bottom: 5px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .tooltip .tt-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
  .tooltip .tt-name { color: var(--text-secondary); flex: 1;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tooltip .tt-val { color: var(--text-primary); font-weight: 600;
                     font-variant-numeric: tabular-nums; }
  .tooltip .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 5px; }

  footer { color: var(--text-muted); font-size: 12px; margin-top: 26px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Copilot — credit usage</h1>
    <span class="sub" id="subtitle"></span>
    <span class="spacer"></span>
    <button class="ghost" id="theme">Theme</button>
  </header>

  <div class="card">
    <div class="hero-row">
      <div class="hero">
        <div class="label" id="hero-label"></div>
        <div class="value"><span id="hero-value"></span><span class="unit">credits</span></div>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <div class="card">
    <div class="cardhead">
      <div>
        <h2>Included quota — <span id="month-label"></span></h2>
        <p class="note" id="meter-note"></p>
      </div>
    </div>
    <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
    <div class="meter-legend"><span id="meter-left"></span><span id="meter-right"></span></div>
  </div>

  <div class="card">
    <div class="cardhead">
      <div>
        <h2>Credits per day, by model</h2>
        <p class="note" id="daily-note"></p>
      </div>
      <span class="spacer"></span>
      <button class="ghost" data-toggle="daily-table">Table</button>
    </div>
    <svg id="chart-daily" role="img" aria-label="Credits consumed per day, stacked by model"></svg>
    <div class="legend" id="legend"></div>
    <div id="daily-table" hidden></div>
  </div>

  <div class="card">
    <div class="cardhead">
      <div>
        <h2>Total by model</h2>
        <p class="note" id="models-note"></p>
      </div>
      <span class="spacer"></span>
      <button class="ghost" data-toggle="models-table">Table</button>
    </div>
    <svg id="chart-models" role="img" aria-label="Total credits by model"></svg>
    <div id="models-table" hidden></div>
  </div>

  <div class="card" id="sessions-card" hidden>
    <div class="cardhead">
      <div>
        <h2>Sessions</h2>
        <p class="note" id="sessions-note"></p>
      </div>
      <span class="spacer"></span>
      <button class="ghost" data-toggle="sessions-table">Table</button>
    </div>
    <div class="calwrap">
      <div><p class="calcap" id="cal-caption"></p><div class="cal" id="calendar" role="group" aria-label="Credits burned per day — click a day to filter the sessions below"></div></div>
      <div class="calside">
        <div class="chips" id="cal-chips"></div>
        <div class="calkey" id="cal-key"></div>
        <p class="calhint" id="cal-hint"></p>
      </div>
    </div>
    <div id="sessions-list"></div>
    <div id="sessions-table" hidden></div>
  </div>

  <footer id="footer"></footer>
</div>

<div class="tooltip" id="tooltip" role="status"></div>

<script>
const DATA = __PAYLOAD__;
const SVG = "http://www.w3.org/2000/svg";
const SLOTS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];

/* Color follows the entity: the slot is fixed by the model's rank in the whole
   window and never re-assigned, so a model keeps its hue in every chart. */
const COLOR = {};
DATA.series.forEach((name, i) => {
  COLOR[name] = name === "Other" ? "var(--s8)" : `var(${SLOTS[Math.min(i, 6)]})`;
});

const LOCALE = "en-GB";
const nf0 = new Intl.NumberFormat(LOCALE, {maximumFractionDigits: 0});
const money = v => "$" + v.toFixed(2);
const dayShort = iso => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(LOCALE, {day: "numeric", month: "short"});
};

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
/* Pick a top-of-axis that splits into four clean tick values (0/1.000/2.000…),
   never 875 / 2.625. */
function niceMax(v) {
  if (v <= 0) return 10;
  const step = v / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(step)));
  return mag * [1, 2, 2.5, 5, 10].find(m => mag * m >= step) * 4;
}

/* ---------- headline figures ---------- */
function renderHeadline() {
  document.getElementById("subtitle").textContent =
    `@${DATA.login} · ${dayShort(DATA.from)} – ${dayShort(DATA.to)}`;
  document.getElementById("hero-label").textContent = `Usage over the last ${DATA.windowDays} days`;
  document.getElementById("hero-value").textContent = nf0.format(DATA.windowCredits);

  const peak = DATA.peak;
  const tiles = [
    ["Value consumed", money(DATA.windowGross), "at $0.01 / credit"],
    ["Of which over quota", money(DATA.windowNet), DATA.windowNet > 0 ? "billed" : "nothing to pay"],
    ["Average per active day", nf0.format(DATA.avgActive), `${DATA.activeDays} days with activity`],
    ["Peak day", nf0.format(peak ? peak.credits : 0), peak ? dayShort(peak.date) : "—"],
  ];
  const host = document.getElementById("tiles");
  tiles.forEach(([label, value, foot]) => {
    const d = document.createElement("div");
    d.className = "tile";
    const l = document.createElement("div"); l.className = "label"; l.textContent = label;
    const v = document.createElement("div"); v.className = "value"; v.textContent = value;
    const f = document.createElement("div"); f.className = "foot"; f.textContent = foot;
    d.append(l, v, f); host.appendChild(d);
  });
}

/* ---------- meter: month-to-date against the included quota ---------- */
function renderMeter() {
  const pct = DATA.quota ? DATA.mtdUsed / DATA.quota : 0;
  const fill = document.getElementById("meter-fill");
  fill.style.width = Math.min(100, pct * 100).toFixed(1) + "%";
  fill.style.background = pct >= 1 ? "var(--critical)" : pct >= 0.8 ? "var(--warning)" : "var(--s1)";
  document.getElementById("month-label").textContent =
    new Date(DATA.monthStart + "T00:00:00").toLocaleDateString(LOCALE,
      {month: "long", year: "numeric"});
  document.getElementById("meter-left").textContent =
    `${nf0.format(DATA.mtdUsed)} / ${nf0.format(DATA.quota)} included credits`;
  document.getElementById("meter-right").textContent = (pct * 100).toFixed(0) + "%";
  document.getElementById("meter-note").textContent =
    `At the current rate the month would close around ${nf0.format(DATA.mtdProjected)} credits.`;
}

/* ---------- chart 1: stacked columns, one stack per day ---------- */
function renderDaily() {
  const svg = document.getElementById("chart-daily");
  const W = 960, H = 360, m = {l: 56, r: 14, t: 26, b: 44};
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const days = DATA.days;
  const max = niceMax(Math.max(...days.map(d => d.credits), 0));
  const y = v => m.t + ph - (v / max) * ph;
  const band = pw / days.length;
  const bw = Math.min(24, band * 0.72);

  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    el("line", {class: i ? "gridline" : "axisline", x1: m.l, x2: m.l + pw, y1: yy, y2: yy}, svg);
    const t = el("text", {class: "tick", x: m.l - 9, y: yy + 4, "text-anchor": "end"}, svg);
    t.textContent = nf0.format(v);
  }

  const GAP = 2, R = 4;
  days.forEach((row, i) => {
    const cx = m.l + band * i + band / 2;
    const x = cx - bw / 2;
    const g = el("g", {class: "band", tabindex: 0, role: "listitem"}, svg);

    // Stack biggest-first from the baseline so the order is stable across days.
    const stack = DATA.series.filter(s => row.models[s] > 0);
    let cursor = m.t + ph;
    stack.forEach((name, k) => {
      const h = (row.models[name] / max) * ph;
      const top = cursor - h;
      const isTop = k === stack.length - 1;
      // 2px surface gap between touching segments; skip it when the segment is
      // too thin to survive one, so a value never disappears entirely.
      const drawH = Math.max(1, h - (k < stack.length - 1 && h > 3 ? GAP : 0));
      const yTop = cursor - drawH;
      let d;
      if (isTop && drawH > R) {
        d = `M${x},${cursor} L${x},${yTop + R} Q${x},${yTop} ${x + R},${yTop} ` +
            `L${x + bw - R},${yTop} Q${x + bw},${yTop} ${x + bw},${yTop + R} L${x + bw},${cursor} Z`;
      } else {
        d = `M${x},${cursor} L${x},${yTop} L${x + bw},${yTop} L${x + bw},${cursor} Z`;
      }
      el("path", {class: "seg", d: d, fill: COLOR[name]}, g);
      cursor = top;
    });

    // Hit target spans the whole band, not just the painted pixels.
    const hit = el("rect", {class: "hit", x: m.l + band * i, y: m.t,
                            width: band, height: ph, fill: "transparent"}, g);
    const show = ev => tipDay(ev, row);
    g.addEventListener("pointermove", show);
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("focus", () => tipDay({clientX: hit.getBoundingClientRect().left + 10,
                                              clientY: hit.getBoundingClientRect().top + 40}, row));
    g.addEventListener("blur", hideTip);

    if (i % 3 === 0 || i === days.length - 1) {
      const t = el("text", {class: "tick", x: cx, y: m.t + ph + 18, "text-anchor": "middle"}, svg);
      t.textContent = dayShort(row.date).replace(" ", " ");
    }
  });

  // Label the extreme only — never a number on every column.
  const peak = DATA.peak;
  if (peak && peak.credits > 0) {
    const i = days.findIndex(d => d.date === peak.date);
    const cx = m.l + band * i + band / 2;
    const t = el("text", {class: "peaklabel", x: Math.min(cx, m.l + pw - 24),
                          y: y(peak.credits) - 8, "text-anchor": "middle"}, svg);
    t.textContent = nf0.format(peak.credits);
  }

  el("line", {class: "axisline", x1: m.l, x2: m.l + pw,
              y1: m.t + ph, y2: m.t + ph}, svg);

  document.getElementById("daily-note").textContent =
    `Stacked by model, in credits. The axis tops out at ${nf0.format(max)}.`;

  const legend = document.getElementById("legend");
  DATA.series.forEach(name => {
    const s = document.createElement("span");
    const i = document.createElement("i"); i.style.background = COLOR[name];
    const label = document.createElement("span"); label.textContent = name;
    s.append(i, label); legend.appendChild(s);
  });
}

/* ---------- chart 2: totals per model ---------- */
function renderModels() {
  const svg = document.getElementById("chart-models");
  const rows = DATA.series.map(n => [n, DATA.totals[n]]).filter(r => r[1] > 0);
  const W = 960, rowH = 34, m = {l: 210, r: 76, t: 8, b: 10};
  const H = m.t + rows.length * rowH + m.b;
  const pw = W - m.l - m.r;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const max = Math.max(...rows.map(r => r[1]), 1);
  const bh = Math.min(24, rowH - 12), R = 4;

  rows.forEach(([name, value], i) => {
    const yTop = m.t + i * rowH + (rowH - bh) / 2;
    const w = Math.max(2, (value / max) * pw);
    const g = el("g", {class: "band", tabindex: 0}, svg);

    const label = el("text", {class: "rowlabel", x: m.l - 12, y: yTop + bh / 2 + 4,
                              "text-anchor": "end"}, svg);
    label.textContent = name;

    const d = w > R
      ? `M${m.l},${yTop} L${m.l + w - R},${yTop} Q${m.l + w},${yTop} ${m.l + w},${yTop + R} ` +
        `L${m.l + w},${yTop + bh - R} Q${m.l + w},${yTop + bh} ${m.l + w - R},${yTop + bh} L${m.l},${yTop + bh} Z`
      : `M${m.l},${yTop} L${m.l + w},${yTop} L${m.l + w},${yTop + bh} L${m.l},${yTop + bh} Z`;
    el("path", {class: "seg", d: d, fill: COLOR[name]}, g);

    // Value at the tip, outside the bar — always fits, never clipped.
    const v = el("text", {class: "tipvalue", x: m.l + w + 10, y: yTop + bh / 2 + 4}, svg);
    v.textContent = nf0.format(value);

    const hit = el("rect", {class: "hit", x: m.l, y: m.t + i * rowH,
                            width: pw + m.r, height: rowH, fill: "transparent"}, g);
    g.addEventListener("pointermove", ev => tipModel(ev, name, value));
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("focus", () => {
      const r = hit.getBoundingClientRect();
      tipModel({clientX: r.left + 40, clientY: r.top}, name, value);
    });
    g.addEventListener("blur", hideTip);
  });

  el("line", {class: "axisline", x1: m.l, x2: m.l, y1: m.t, y2: H - m.b}, svg);

  const tail = Object.keys(DATA.allModels).length - rows.length + (DATA.totals.Other ? 1 : 0);
  document.getElementById("models-note").textContent = DATA.totals.Other
    ? `Top ${rows.length - 1} models; the remaining ${tail} are folded into “Other”.`
    : `All ${rows.length} models used in the period.`;
}

/* ---------- tooltips ---------- */
const tip = document.getElementById("tooltip");
function place(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, yy = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (yy + r.height > innerHeight - 8) yy = innerHeight - r.height - 8;
  tip.style.left = x + "px"; tip.style.top = yy + "px"; tip.style.opacity = 1;
}
function row(name, value, color) {
  const r = document.createElement("div"); r.className = "tt-row";
  const k = document.createElement("span"); k.className = "tt-key"; k.style.background = color;
  const n = document.createElement("span"); n.className = "tt-name"; n.textContent = name;
  const v = document.createElement("span"); v.className = "tt-val"; v.textContent = value;
  r.append(k, n, v); return r;
}
function tipDay(ev, d) {
  tip.textContent = "";
  const h = document.createElement("div"); h.className = "tt-head";
  h.textContent = dayShort(d.date);
  tip.appendChild(h);
  const used = DATA.series.filter(s => d.models[s] > 0);
  if (!used.length) {
    const p = document.createElement("div"); p.className = "tt-name";
    p.textContent = "no usage"; tip.appendChild(p);
  }
  used.slice().reverse().forEach(n => tip.appendChild(row(n, nf0.format(d.models[n]), COLOR[n])));
  const t = row("Total", nf0.format(d.credits) + " AIC · " + money(d.gross), "transparent");
  t.classList.add("tt-total"); tip.appendChild(t);
  place(ev);
}
function tipModel(ev, name, value) {
  tip.textContent = "";
  const h = document.createElement("div"); h.className = "tt-head"; h.textContent = name;
  tip.appendChild(h);
  tip.appendChild(row("Credits", nf0.format(value), COLOR[name]));
  tip.appendChild(row("Value", money(value / 100), "transparent"));
  tip.appendChild(row("Share", (value / DATA.windowCredits * 100).toFixed(1) + "%", "transparent"));
  place(ev);
}
function hideTip() { tip.style.opacity = 0; }

/* ---------- sessions ---------- */
/* Each session is one line of prose plus one number, ranked by cost. A bar chart
   was the wrong form here: the labels ARE the content, and 100+ categories with
   a long tail of zeros reads as a list, not a distribution. */
const SESS = DATA.sessions;

const shortWhen = s => {
  if (!s) return "";
  const d = new Date(s.replace(" ", "T"));
  return isNaN(d) ? s : d.toLocaleDateString(LOCALE, {day: "numeric", month: "short"}) +
    " " + d.toLocaleTimeString(LOCALE, {hour: "2-digit", minute: "2-digit"});
};
const minutesBetween = (a, b) => {
  const x = new Date((a || "").replace(" ", "T")), y = new Date((b || "").replace(" ", "T"));
  if (isNaN(x) || isNaN(y)) return null;
  return Math.round((y - x) / 60000);
};
const dominantModel = s => {
  let best = null, top = -1;
  for (const m in s.models) if (s.models[m] > top) { top = s.models[m]; best = m; }
  return best;
};

/* The day a session belongs to is the day it STARTED: that is the day you'd
   remember doing the work, even for the rare session that ran past midnight. */
const sessionDay = s => (s.started || s.ended || "").slice(0, 10);

/* Heat is measured against the daily share of the monthly quota, not against the
   window's own peak: a relative scale would repaint every cell as soon as one
   heavy day entered the window, and "dark" would mean something different each
   time you opened the report. */
const DAYS_IN_MONTH = new Date(new Date(DATA.monthStart).getFullYear(),
                               new Date(DATA.monthStart).getMonth() + 1, 0).getDate();
const FAIR_DAY = DATA.quota / DAYS_IN_MONTH;
const HEAT_STEPS = [
  {upto: 0.25, mix: 16}, {upto: 0.5, mix: 32}, {upto: 1, mix: 52},
  {upto: 2, mix: 76}, {upto: Infinity, mix: 100},
];
function heatMix(credits) {
  if (!credits) return null;
  const r = credits / FAIR_DAY;
  return HEAT_STEPS.find(s => r < s.upto).mix;
}
const heatFill = mix => mix === null ? "var(--grid)"
  : `color-mix(in oklab, var(--critical) ${mix}%, var(--surface-1))`;

const DAY_BY_ISO = {};
DATA.days.forEach(d => { DAY_BY_ISO[d.date] = d; });

/* Filter state: an inclusive [from, to] pair of ISO days, or null for "all". */
let range = null;
let anchor = null;                       // for shift-click range selection

function iso(d) { return d.toISOString().slice(0, 10); }
function addDays(isoStr, n) {
  const d = new Date(isoStr + "T12:00:00");
  d.setDate(d.getDate() + n);
  return iso(d);
}

function renderCalendar() {
  const host = document.getElementById("calendar");
  host.textContent = "";
  ["M", "T", "W", "T", "F", "S", "S"].forEach((d, i) => {
    const h = document.createElement("div");
    h.className = "dow"; h.textContent = d;
    h.setAttribute("aria-hidden", "true");
    host.appendChild(h);
  });
  // Whole weeks, Monday-first, so the grid reads as a calendar rather than as a
  // 30-cell ribbon; days outside the window are drawn faded and inert.
  const first = new Date(DATA.from + "T12:00:00");
  first.setDate(first.getDate() - ((first.getDay() + 6) % 7));
  const last = new Date(DATA.to + "T12:00:00");
  last.setDate(last.getDate() + (6 - (last.getDay() + 6) % 7));

  for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) {
    const key = iso(d);
    const row = DAY_BY_ISO[key];
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cell" + (row ? "" : " out");
    cell.dataset.day = key;
    const mix = row ? heatMix(row.credits) : null;
    cell.style.background = heatFill(mix);
    if (mix !== null && mix >= 52) cell.classList.add("hot");
    const n = document.createElement("span");
    n.textContent = d.getDate();
    cell.appendChild(n);
    cell.setAttribute("aria-label",
      dayShort(key) + ": " + (row ? nf0.format(row.credits) + " AIC" : "outside the window"));
    if (row) {
      cell.addEventListener("mouseenter", ev => tipDay(ev, row));
      cell.addEventListener("mousemove", place);
      cell.addEventListener("mouseleave", hideTip);
      cell.addEventListener("click", ev => {
        // Shift extends from the last plain click: the two-click idiom people
        // already know from file lists, no drag handling to get wrong.
        if (ev.shiftKey && anchor) {
          setRange(anchor < key ? anchor : key, anchor < key ? key : anchor, null);
        } else if (range && range[0] === key && range[1] === key) {
          setRange(null, null, "all");          // clicking the selected day clears it
        } else {
          anchor = key;
          setRange(key, key, null);
        }
      });
    } else {
      cell.disabled = true;
    }
    host.appendChild(cell);
  }

  document.getElementById("cal-caption").textContent =
    dayShort(DATA.from) + " – " + dayShort(DATA.to) + " " + new Date(DATA.to).getFullYear();

  const key = document.getElementById("cal-key");
  key.textContent = "";
  key.appendChild(document.createTextNode("less"));
  [null, 16, 32, 52, 76, 100].forEach(mix => {
    const i = document.createElement("i");
    i.style.background = heatFill(mix);
    key.appendChild(i);
  });
  key.appendChild(document.createTextNode("more"));
  document.getElementById("cal-hint").textContent =
    `A day is “dark” relative to your own budget: ${nf0.format(FAIR_DAY)} AIC is ` +
    `1/${DAYS_IN_MONTH} of the ${nf0.format(DATA.quota)} monthly allowance, and the top step ` +
    `is 2× that. Click a day to see its sessions, shift-click a second day for a span.`;
}

const CHIPS = [
  {id: "7", label: "Last 7 days", days: 7},
  {id: "30", label: `Last ${DATA.windowDays} days`, days: DATA.windowDays},
  {id: "all", label: "All", days: null},
];

function renderChips() {
  const host = document.getElementById("cal-chips");
  host.textContent = "";
  CHIPS.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = c.label;
    b.dataset.chip = c.id;
    b.addEventListener("click", () => {
      anchor = null;
      if (c.days === null) setRange(null, null, "all");
      else setRange(addDays(DATA.to, -(c.days - 1)), DATA.to, c.id);
    });
    host.appendChild(b);
  });
}

function setRange(from, to, chipId) {
  range = from ? [from, to] : null;
  document.querySelectorAll("#cal-chips .chip").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.chip === chipId));
  });
  document.querySelectorAll("#calendar .cell").forEach(c => {
    const d = c.dataset.day;
    c.classList.toggle("sel", !!range && d >= range[0] && d <= range[1] && !c.disabled);
  });
  renderSessionList();
}

function visibleSessions() {
  if (!range) return SESS.rows;
  return SESS.rows.filter(s => {
    const d = sessionDay(s);
    return d >= range[0] && d <= range[1];
  });
}

function renderSessionList() {
  const host = document.getElementById("sessions-list");
  host.textContent = "";
  const rows = visibleSessions();
  const max = Math.max(...SESS.rows.map(s => s.credits), 1);
  // The list is the "where did the month go" view, so it stops after the rows
  // that answer that; every session stays available in the table twin below.
  const shown = rows.slice(0, SESS.listLimit);

  if (!rows.length) {
    const p = document.createElement("p");
    p.className = "calhint";
    p.textContent = "No sessions in this range.";
    host.appendChild(p);
  }

  shown.forEach(s => {
    const row = document.createElement("div");
    row.className = "srow";

    const main = document.createElement("div");
    const title = document.createElement("div");
    title.className = "stitle";
    title.textContent = s.title;
    const meta = document.createElement("span");
    meta.className = "smeta";
    const mins = minutesBetween(s.started, s.ended);
    meta.textContent = [
      s.repo + (s.branch && !/^(main|master)$/.test(s.branch) ? "@" + s.branch : ""),
      shortWhen(s.started),
      mins !== null && mins > 0 ? (mins >= 60 ? Math.floor(mins / 60) + "h" + (mins % 60) + "m" : mins + "m") : null,
      s.turns ? s.turns + (s.turns === 1 ? " turn" : " turns") : null,
      s.requests ? s.requests + " calls" : null,
    ].filter(Boolean).join(" · ");
    title.appendChild(meta);
    main.appendChild(title);

    if (s.summary) {
      const sum = document.createElement("div");
      sum.className = "ssum";
      sum.textContent = s.summary;
      main.appendChild(sum);
    }
    if (s.fileCount) {
      const f = document.createElement("div");
      f.className = "sfiles";
      const names = s.files.map(p => p.split("/").pop());
      f.textContent = s.fileCount + " file" + (s.fileCount === 1 ? "" : "s") + ": " +
        names.slice(0, 5).join(", ") + (s.fileCount > 5 ? ", …" : "");
      main.appendChild(f);
    }
    row.appendChild(main);

    const cost = document.createElement("div");
    cost.className = "scost";
    if (s.priced) {
      cost.textContent = nf0.format(s.credits);
      const u = document.createElement("span");
      u.className = "unit";
      u.textContent = s.partial ? "AIC+" : "AIC";
      cost.appendChild(u);
      cost.title = s.partial
        ? "Some calls in this session predate per-call pricing — this is a floor, not the full cost."
        : Object.entries(s.models).map(([m, v]) => `${m}: ${v}`).join("\n");
    } else {
      cost.textContent = "—";
      cost.title = "No per-call pricing recorded for this session.";
    }
    row.appendChild(cost);

    if (s.priced && s.credits > 0) {
      const track = document.createElement("div");
      track.className = "sbar";
      const fill = document.createElement("i");
      fill.style.width = Math.max(1.5, s.credits / max * 100) + "%";
      const dom = dominantModel(s);
      fill.style.background = COLOR[dom] || "var(--s8)";
      track.appendChild(fill);
      row.appendChild(track);
    }
    host.appendChild(row);
  });

  const spent = rows.reduce((a, s) => a + s.credits, 0);
  const where = range
    ? (range[0] === range[1] ? `on ${dayShort(range[0])}`
                             : `${dayShort(range[0])} – ${dayShort(range[1])}`)
    : `over ${DATA.windowDays} days`;
  const bits = [
    `${rows.length} session${rows.length === 1 ? "" : "s"} ${where}, ${nf0.format(spent)} AIC`,
    shown.length < rows.length ? `top ${shown.length} listed` : null,
    `${SESS.pricedCount}/${SESS.count} sessions carry per-call pricing` +
      (SESS.since ? ` (the CLI only started recording it on ${dayShort(SESS.since)})` : ""),
  ].filter(Boolean);
  document.getElementById("sessions-note").textContent =
    bits.join(" — ") + `. Titles come from the CLI's own session store; one-line ` +
    `descriptions are written by ${SESS.model}` + (SESS.note ? ` (${SESS.note})` : "") + ".";

  renderSessionTable(rows);
}

function renderSessionTable(rows) {
  const host = document.getElementById("sessions-table");
  host.textContent = "";
  buildTable(host,
    ["Session", "Started", "Repo", "Turns", "Calls", "Models", "AIC"],
    rows.map(s => [
      {text: s.title, color: s.priced ? (COLOR[dominantModel(s)] || "var(--s8)") : undefined},
      shortWhen(s.started), s.repo + (s.branch ? "@" + s.branch : ""),
      s.turns || "—", s.requests || "—",
      Object.keys(s.models).join(", ") || "—",
      s.priced ? nf0.format(s.credits) + (s.partial ? "+" : "") : "—",
    ]), [1, 2, 5]);
}

function renderSessions() {
  if (!SESS || !SESS.rows.length) return;
  document.getElementById("sessions-card").hidden = false;
  renderCalendar();
  renderChips();
  // The last week is the default view: a month of sessions is a wall, and the
  // question you open this with is almost always "what did I just spend?".
  setRange(addDays(DATA.to, -6), DATA.to, "7");
}

/* ---------- table views (the WCAG-clean twin of each chart) ---------- */
function buildTable(host, head, rows, leftCols = []) {
  const t = document.createElement("table");
  const thead = document.createElement("thead"), tr = document.createElement("tr");
  head.forEach((h, i) => {
    const th = document.createElement("th");
    th.textContent = h;
    if (leftCols.includes(i)) th.className = "name";
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  rows.forEach(cells => {
    const r = document.createElement("tr");
    cells.forEach((c, i) => {
      const td = document.createElement("td");
      if (i === 0) {
        td.className = "name";
        if (c.color) {
          const sw = document.createElement("span");
          sw.className = "swatch"; sw.style.background = c.color; td.appendChild(sw);
        }
        td.appendChild(document.createTextNode(c.text !== undefined ? c.text : c));
      } else {
        td.textContent = c;
        if (leftCols.includes(i)) td.className = "name";
      }
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb); host.appendChild(t);
}
function renderTables() {
  buildTable(document.getElementById("daily-table"),
    ["Day", "Credits", "Value", "Included", "Over quota", "Models"],
    DATA.days.map(d => [
      dayShort(d.date), nf0.format(d.credits), money(d.gross),
      money(d.included), money(d.net),
      DATA.series.filter(s => d.models[s] > 0).join(", ") || "—",
    ]), [5]);
  buildTable(document.getElementById("models-table"),
    ["Model", "Credits", "Value", "Share"],
    DATA.series.filter(n => DATA.totals[n] > 0).map(n => [
      {text: n, color: COLOR[n]}, nf0.format(DATA.totals[n]), money(DATA.totals[n] / 100),
      (DATA.totals[n] / DATA.windowCredits * 100).toFixed(1) + "%",
    ]));
}

/* ---------- chrome ---------- */
document.querySelectorAll("[data-toggle]").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = document.getElementById(btn.dataset.toggle);
    target.hidden = !target.hidden;
    btn.textContent = target.hidden ? "Table" : "Hide table";
  });
});
document.getElementById("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
});

renderHeadline();
renderMeter();
renderDaily();
renderModels();
renderSessions();
renderTables();
document.getElementById("footer").textContent =
  `Generated ${DATA.generatedAt} from /users/${DATA.login}/settings/billing/premium_request/usage, ` +
  `queried one day at a time. One credit = $0.01. Usage before ${DATA.eraSwitch} was metered as ` +
  `“premium requests” at $0.04 each; it is converted here by value (1 request = 4 credits) so the ` +
  `series stays continuous. Hourly granularity does not exist in the API.` +
  (SESS ? ` Session costs come from a different source — the CLI's local session store ` +
          `(~/.copilot/session-store.db), priced per model call — so they are close to, but never ` +
          `exactly, the billing totals above: the DB only knows what this machine ran.` : "");
</script>
</body>
</html>
